name: Build for Hostinger

# Hostinger's Git deploy only copies files; it cannot run Composer.
# On every push this job installs the PHP dependencies and pushes a
# ready-to-run copy (with vendor/) to a build branch:
#   develop -> build-dev   (dev.mytransfertours.com)
#   main    -> build-main  (live site, at launch)
#   others  -> build-wip   (test builds, never deployed)
# Hostinger is connected to the build branch, not to develop/main.

on:
  push:
    branches: ['**', '!build-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref_name }}
  # develop waits for a running build instead of cancelling it: a cancelled FTP
  # upload would have to start over.
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip
          coverage: none

      - name: Install dependencies (production)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Syntax check
        run: find app database routes bootstrap public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Check the app boots
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan about --only=environment
          rm .env

      - name: Strip docs from vendor
        # Not needed on the server, and some (e.g. stripe-php's README) contain example keys
        # that GitHub's secret scanning blocks.
        run: find vendor -type f \( -iname '*.md' -o -iname '*.markdown' \) -delete

      - name: Stamp build id
        run: echo "${GITHUB_SHA}" > BUILD_ID

      - name: Push ready-to-run build
        run: |
          case "${GITHUB_REF_NAME}" in develop) TARGET="build-dev" ;; main) TARGET="build-main" ;; *) TARGET="build-wip" ;; esac
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Remember the previous build, so the dev upload below sends only what changed.
          if git fetch -q --depth=1 origin "${TARGET}"; then echo "PREVIOUS_BUILD=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"; fi
          git checkout --orphan "$TARGET-tmp"
          git rm -r -q --cached .github
          rm -rf .github
          git add -A
          git add -f vendor composer.lock BUILD_ID
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f origin "HEAD:${TARGET}"
          echo "Pushed to ${TARGET}"

      # Hostinger allows one Git connection, and it serves the live site (build-main).
      # Dev is updated here instead: the files that differ from the previous build-dev
      # are uploaded (and removed files deleted) over FTP, usually a handful, in seconds.
      # The dev folder must hold that previous build (it does after a Git deploy of
      # build-dev, or after any earlier run of this step).
      # Off until the repository variable DEV_FTP_ENABLED is "true" and the DEV_FTP_*
      # secrets are set (Settings -> Secrets and variables -> Actions); see docs/DEPLOY-HOSTINGER.md.
      - name: Upload changed files to dev over FTP
        if: github.ref_name == 'develop' && vars.DEV_FTP_ENABLED == 'true'
        env:
          FTP_SERVER: ${{ secrets.DEV_FTP_SERVER }}
          FTP_USER: ${{ secrets.DEV_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.DEV_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.DEV_FTP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${PREVIOUS_BUILD:-}" ]; then echo "No FTP server or no previous build: skipped"; exit 0; fi
          DIR="${FTP_DIR#./}"; DIR="${DIR#/}"; [ -z "$DIR" ] || DIR="${DIR%/}/"
          BASE="ftp://${FTP_SERVER}/${DIR}"
          # Hostinger's FTP server drops FTPS data connections from GitHub's runners: plain FTP.
          # The FTP account is limited to the dev folder. storage/ (logs, sessions) is never touched.
          git diff --name-status --no-renames "$PREVIOUS_BUILD" HEAD -- . ':(exclude)storage' > /tmp/changes
          echo "$(wc -l < /tmp/changes) changed file(s)"
          up() { curl -sS --globoff --ftp-create-dirs --retry 3 --user "${FTP_USER}:${FTP_PASS}" -T "$1" "${BASE}${1// /%20}"; echo "  up  $1"; }
          while IFS=$'\t' read -r status path; do
            [ "$path" = "BUILD_ID" ] && continue
            if [ "$status" = "D" ]; then
              curl -sS --globoff --user "${FTP_USER}:${FTP_PASS}" "ftp://${FTP_SERVER}/" -Q "DELE /${DIR}${path}" -o /dev/null || echo "  (could not delete $path)"
              echo "  del $path"
            else
              up "$path"
            fi
          done < /tmp/changes
          # Always send the whole Composer autoload set, and delete Laravel's cached
          # package/service lists: a stale list naming a package this build doesn't have
          # (e.g. a dev-only one) stops the app, and the cron that would clear it, from booting.
          for f in vendor/composer/*.php vendor/composer/installed.json; do up "$f"; done
          for f in bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php; do
            curl -sS --globoff --user "${FTP_USER}:${FTP_PASS}" "ftp://${FTP_SERVER}/" -Q "DELE /${DIR}${f}" -o /dev/null 2>/dev/null && echo "  del $f" || true
          done
          # BUILD_ID last: the server's cron applies the update (migrations, caches) when it changes.
          up BUILD_ID
